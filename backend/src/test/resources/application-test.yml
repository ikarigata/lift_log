spring:
  application:
    name: lift_log
  datasource:
    url: ${SPRING_DATASOURCE_URL_TEST:jdbc:postgresql://localhost:5439/lift_log_test}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false

server:
  port: ${SERVER_TEST_PORT:8081}

logging:
  level:
    com.ikr.lift_log: DEBUG
    org.jooq: DEBUG