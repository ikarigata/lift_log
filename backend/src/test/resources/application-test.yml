spring:
  application:
    name: ${APP_NAME}
  datasource:
    url: ${DB_URL_TEST}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false

server:
  port: ${SERVER_TEST_PORT}

logging:
  level:
    com.ikr.lift_log: DEBUG
    org.jooq: DEBUG