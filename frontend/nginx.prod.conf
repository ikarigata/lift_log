# ========================================
# Cloudflare IP判定設定
# ========================================
# 目的: 直接IPアクセスを防ぎ、Cloudflare経由のアクセスのみ許可
# 理由: セキュリティ強化（DDoS攻撃防止、証明書の不正使用防止）
# 動作: 接続元IPがCloudflareの範囲内かどうかを変数 $is_cloudflare で判定
geo $realip_remote_addr $is_cloudflare {
    default 0;  # デフォルト: Cloudflareではない（0）
    
    # Cloudflare IPv4 IP範囲（公式発表のIP範囲）
    # これらのIPからのアクセスのみCloudflareと判定（1）
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    
    # Cloudflare IPv6 IP範囲
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# ========================================
# Real IP取得設定
# ========================================
# 目的: CloudflareのリバースプロキシからクライアントのReal IPを取得
# 理由: アクセスログやセキュリティ対策で実際のクライアントIPが必要
# 動作: CloudflareのIPからアクセスされた場合、$remote_addrを実際のクライアントIPに変更
# 注意: 上記のgeo判定は、$realip_remote_addrを使用してReal IP変換前の接続元IP（CloudflareのIP）で判定される

# Cloudflare IPv4 IP範囲（Real IP取得対象）
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Cloudflare IPv6 IP範囲（Real IP取得対象）
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Real IPヘッダー設定
# 目的: CloudflareがReal IPを格納するヘッダー名を指定
# CF-Connecting-IP: Cloudflareが実際のクライアントIPを格納するヘッダー
real_ip_header CF-Connecting-IP;

# ========================================
# HTTP→HTTPS リダイレクト設定
# ========================================
# 目的: HTTP（80番ポート）でのアクセスを強制的にHTTPS（443番ポート）にリダイレクト
# 理由: セキュリティ強化（平文通信の防止、SSL証明書の強制使用）
# 動作: HTTP アクセスに対して 301 リダイレクトレスポンスを返す
server {
    listen 80;                          # HTTP（80番ポート）で待機
    server_name _;                      # すべてのドメイン名に対応
    return 301 https://$host$request_uri;  # HTTPS URLにリダイレクト
}

# ========================================
# HTTPS メインサーバー設定
# ========================================
# 目的: HTTPS（443番ポート）でWebアプリケーションを配信
# 理由: セキュアな通信でアプリケーションを提供
server {
    listen 443 ssl http2;              # HTTPS（443番ポート）で待機、HTTP/2有効
    server_name _;                      # すべてのドメイン名に対応

    # ドキュメントルート設定
    # 目的: 静的ファイル（HTML, CSS, JS等）の配信元ディレクトリ指定
    root /usr/share/nginx/html;         # Nginxコンテナ内の標準ディレクトリ
    index index.html;                   # デフォルトファイル

    # ========================================
    # SSL証明書設定
    # ========================================
    # 目的: HTTPS通信用のSSL証明書と秘密鍵の指定
    # 証明書: Cloudflare Origin Certificate（Cloudflare発行）
    ssl_certificate /etc/ssl/certs/cert.pem;      # 公開鍵証明書
    ssl_certificate_key /etc/ssl/private/key.pem; # 秘密鍵

    # ========================================
    # SSL/TLS セキュリティ設定
    # ========================================
    # 目的: セキュアで高速なSSL/TLS通信の実現
    ssl_protocols TLSv1.2 TLSv1.3;     # 安全なTLSバージョンのみ許可
    # 推奨暗号化スイート（Forward Secrecy対応）
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;      # クライアント優先で暗号化方式選択
    ssl_session_cache shared:SSL:10m;   # SSL セッション情報をキャッシュ（性能向上）
    ssl_session_timeout 10m;            # セッションキャッシュの有効時間

    # ========================================
    # セキュリティヘッダー設定
    # ========================================
    # 目的: ブラウザレベルでのセキュリティ強化
    # HSTS: HTTPS通信を強制（1年間）、サブドメインも対象
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Clickjacking攻撃防止（iframe埋め込み制限）
    add_header X-Frame-Options "SAMEORIGIN" always;
    # MIME タイプスニッフィング攻撃防止
    add_header X-Content-Type-Options "nosniff" always;
    # XSS（クロスサイトスクリプティング）攻撃防止
    add_header X-XSS-Protection "1; mode=block" always;
    # リファラー情報の制御（プライバシー保護）
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ========================================
    # Cloudflare アクセス制限
    # ========================================
    # 目的: 直接IPアクセスの完全遮断
    # 理由: DDoS防止、証明書の不正使用防止、Cloudflareの保護機能を確実に通す
    # 動作: Cloudflare以外からのアクセスは403エラーを返す
    if ($is_cloudflare = 0) {
        return 403;
    }

    # ========================================
    # API プロキシ設定
    # ========================================
    # 目的: /api/ で始まるリクエストをバックエンド（Spring Boot）に転送
    # 理由: フロントエンドとバックエンドの統合、CORS問題の解決
    location /api/ {
        # バックエンド（Spring Boot）への転送
        # backend: docker-compose.ymlで定義されたサービス名
        proxy_pass http://backend:8080;
        
        # プロキシヘッダー設定（バックエンドが正しい情報を受け取るため）
        proxy_set_header Host $host;                           # 元のホスト名
        proxy_set_header X-Real-IP $remote_addr;               # クライアントのReal IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # プロキシチェーン情報
        proxy_set_header X-Forwarded-Proto $scheme;            # プロトコル（https）
        
        # ========================================
        # CORS（Cross-Origin Resource Sharing）設定
        # ========================================
        # 目的: ブラウザのCORS制限を回避（開発・テスト用）
        # 注意: 本番環境では適切なオリジン制限を推奨
        proxy_set_header Access-Control-Allow-Origin *;
        proxy_set_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        proxy_set_header Access-Control-Allow-Headers "Content-Type, Authorization";
        
        # OPTIONS プリフライトリクエストの処理
        # 目的: ブラウザのCORSプリフライトチェックに対応
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            return 204;  # No Content レスポンス
        }
    }

    # ========================================
    # SPA（Single Page Application）対応設定
    # ========================================
    # 目的: React Router等のクライアントサイドルーティングに対応
    # 理由: ブラウザで直接URL入力時やリロード時も正常にアプリが表示される
    # 動作: 存在しないパスは全てindex.htmlにフォールバック
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ========================================
    # 静的ファイル キャッシュ設定
    # ========================================
    # 目的: 画像・CSS・JSファイル等の配信性能向上
    # 理由: ブラウザキャッシュによる読み込み速度向上、帯域幅削減
    # 対象: 画像、スタイルシート、JavaScript、フォントファイル
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;                                # 1年間ブラウザキャッシュ
        add_header Cache-Control "public, immutable";  # キャッシュ制御ヘッダー
    }

    # ========================================
    # gzip 圧縮設定
    # ========================================
    # 目的: レスポンスサイズの削減（転送量・表示速度の向上）
    # 理由: 特にテキストファイル（HTML, CSS, JS）の圧縮効果が高い
    gzip on;                    # gzip圧縮を有効化
    gzip_vary on;               # Accept-Encodingヘッダーに基づく圧縮
    gzip_min_length 1024;       # 1KB以上のファイルのみ圧縮（小さいファイルは効果薄）
    gzip_types                  # 圧縮対象のMIMEタイプ
        text/plain              # プレーンテキスト
        text/css                # CSS
        text/xml                # XML
        text/javascript         # JavaScript（レガシー）
        application/javascript  # JavaScript（標準）
        application/xml+rss     # RSS
        application/json;       # JSON
}