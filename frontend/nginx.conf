# =============================================================================
# Nginx設定ファイル - React SPA + Spring Boot API プロキシ
# =============================================================================

server {
    # HTTPポート80でリッスン
    listen 80;
    server_name localhost;

    # 静的ファイルのルートディレクトリ
    root /usr/share/nginx/html;
    index index.html;

    # ログ設定
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # -----------------------------------------------------------------------------
    # APIプロキシ設定
    # /api/v1/ で始まるリクエストをバックエンドサービスに転送
    # -----------------------------------------------------------------------------
    location /api/v1/ {
        # バックエンドサービス（Spring Boot）にプロキシ
        proxy_pass http://backend:8080/api/v1/;
        
        # プロキシヘッダーの設定
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # タイムアウト設定
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # バッファリング設定
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # -----------------------------------------------------------------------------
    # SPA（Single Page Application）ルーティング設定
    # React Router の履歴APIに対応
    # -----------------------------------------------------------------------------
    location / {
        # 静的ファイルを直接提供
        # ファイルが見つからない場合はindex.htmlにフォールバック
        # これによりReact Routerのクライアントサイドルーティングが機能
        try_files $uri $uri/ /index.html;
        
        # キャッシュ制御ヘッダー
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # -----------------------------------------------------------------------------
    # 静的アセット（CSS、JS、画像等）のキャッシュ設定
    # -----------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        # 長期キャッシュを設定（1年）
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # ETagを有効化
        etag on;
        
        # Gzip圧縮を有効化
        gzip_static on;
    }

    # -----------------------------------------------------------------------------
    # セキュリティヘッダー設定
    # -----------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -----------------------------------------------------------------------------
    # Gzip圧縮設定
    # -----------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # -----------------------------------------------------------------------------
    # エラーページ設定
    # -----------------------------------------------------------------------------
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
