# ========================================
# HTTPS サーバブロック（メイン設定）
# ----------------------------------------
# フロントエンド静的ファイル配信 + APIリバースプロキシ
# ========================================
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # --------------------------
    # 静的ファイル（フロントエンド）
    # --------------------------
    root  /usr/share/nginx/html;   # フロントのビルド成果物を配置
    index index.html;

    # --------------------------
    # サーバ証明書（Cloudflare Origin Certificate）
    # --------------------------
    ssl_certificate     /etc/ssl/certs/cert.pem;       # 公開鍵証明書
    ssl_certificate_key /etc/ssl/private/key.pem;      # 秘密鍵

    # --------------------------
    # Authenticated Origin Pulls（一時的に無効化）
    # --------------------------
    # Cloudflare が提示するクライアント証明書を検証するため、
    # Cloudflare Origin Pull CA を指定。
    # ※クライアント証明書本体ではなく CA を置く点が重要。
    # ssl_client_certificate /etc/ssl/certs/cloudflare-origin-pull-ca.pem;
    # ssl_verify_client on;    # クライアント証明書の検証を必須化
    # ssl_verify_depth 1;      # チェーンの深さ（CA → 証明書）

    # --------------------------
    # TLS の最低バージョン指定
    # --------------------------
    ssl_protocols TLSv1.2 TLSv1.3;

    # --------------------------
    # API プロキシ設定
    # --------------------------
    # /api/ 以下は backend コンテナ（Spring Boot）へ転送。
    # コンテナ名 "backend" で Docker 内DNSを使って名前解決。
    location /api/ {
      proxy_pass http://backend:8080;

      # 転送時に元リクエストの情報を付加
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------
    # SPA ルーティング対応
    # --------------------------
    # React Router等で /foo のようなパスを直接叩かれても
    # index.html にフォールバックするようにする。
    location / {
      try_files $uri $uri/ /index.html;
    }

    # index.html はキャッシュさせない
    location = /index.html {
      add_header Cache-Control "no-cache, must-revalidate";
    }

    # ハッシュ付き静的アセットは長期キャッシュ
    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?|ttf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }