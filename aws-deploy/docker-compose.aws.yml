# Docker Compose configuration for AWS deployment
# Optimized for single EC2 instance deployment

services:
  db:
    image: postgres:15
    container_name: lift-log-db
    env_file: [.env.aws]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /opt/lift-log/data/postgres-backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - lift-log-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: 
      context: ..
      dockerfile: backend/Dockerfile
    container_name: lift-log-backend
    env_file: [.env.aws]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24}
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
    expose: 
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - lift-log-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /opt/lift-log/logs/backend:/app/logs

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: "/api"
        VITE_USE_MSW: "false"
    container_name: lift-log-frontend
    env_file: [.env.aws]
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - /opt/lift-log/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/lift-log/nginx/ssl:/etc/nginx/ssl:ro
      - /opt/lift-log/logs/nginx:/var/log/nginx
    restart: unless-stopped
    networks:
      - lift-log-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Database migration service (run manually)
  flyway:
    image: flyway/flyway:10
    container_name: lift-log-flyway
    profiles: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_BASELINE_ON_MIGRATE: true
      FLYWAY_VALIDATE_ON_MIGRATE: true
    volumes:
      - ../backend/src/main/resources/db/migration:/flyway/sql:ro
    networks:
      - lift-log-network
    command: ["migrate"]

  # Backup service (runs daily)
  backup:
    image: postgres:15
    container_name: lift-log-backup
    profiles: ["backup"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /opt/lift-log/data/postgres-backups:/backups
      - /opt/lift-log/scripts:/scripts:ro
    networks:
      - lift-log-network
    command: |
      sh -c '
        echo "Starting backup at $$(date)"
        pg_dump -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB} | gzip > /backups/backup_$$(date +%Y%m%d_%H%M%S).sql.gz
        echo "Backup completed at $$(date)"
        # Keep only last 7 days of backups
        find /backups -name "backup_*.sql.gz" -mtime +7 -delete
      '

  # SSL certificate management with Let's Encrypt
  certbot:
    image: certbot/certbot
    container_name: lift-log-certbot
    profiles: ["ssl"]
    volumes:
      - /opt/lift-log/nginx/ssl:/etc/letsencrypt
      - /opt/lift-log/nginx/webroot:/var/www/certbot
    command: >
      sh -c "
        if [ -n '${DOMAIN_NAME}' ]; then
          certbot certonly --webroot --webroot-path=/var/www/certbot
          --email ${SSL_EMAIL} --agree-tos --no-eff-email
          -d ${DOMAIN_NAME}
        else
          echo 'DOMAIN_NAME not set, skipping SSL certificate generation'
        fi
      "

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/lift-log/data/postgres

networks:
  lift-log-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16